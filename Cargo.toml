[package]
name = "ZoneServer"
version = "0.1.0"
edition = "2024"

[dependencies]
nalgebra = "0.34"
tokio = { version = "1.48.0", features = ["full"] }
futures = "0.3"
protobuf = "4.33.4-release"
ticktock = "0.8"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
simplelog = "0.12"
time = "0.3.47"
lazy_static = "1.5"
rand = "0.10"
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14.3"

[build-dependencies]
tonic-prost-build = "0.14"
